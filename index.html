<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | Stats preview card component</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&family=Lexend+Deca:wght@400&display=swap" rel="stylesheet">
 
  <link rel="stylesheet" href="style.css">

</head>
<body>

  <main class="page">
    <article class="card">
      <picture class="main-img">
        <source media="(min-width: 768px)" srcset="images/image-header-desktop.jpg">
        <img src="images/image-header-mobile.jpg" alt="Team working together">
      </picture>
      <div class="content">
        <h1 class="card-title">Get <span>insights</span> that help your business grow.</h1>

        <p class="card-text">
          Discover the benefits of data analytics 
          and make better decisions regarding revenue, customer 
          experience, and overall efficiency.
        </p>

        <ul class="stats">

          <li class="company"><strong>10k+</strong><span>companies</span></li>
          <li class="template"><strong>314</strong> <span>templates</span></li>
          <li class="query"><strong>12M+</strong><span>queries</span></li>
          
        </ul>
      </div>
  </article>
</main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="https://github.com/ahmedattlam10">ahmed.attlam</a>.
  </footer>
</body>
</html>
